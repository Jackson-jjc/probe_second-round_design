<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title"><title id="title">B flow from a shared object through real replies and clarification to a separate postcard preview and optional email</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58766d"/></marker></defs><rect width="100%" height="100%" fill="#faf8f1"/><g font-family="Arial, sans-serif" fill="#20352f"><text x="50" y="65" font-size="36" font-weight="bold" fill="#20352f">B · A real exchange, then an optional postcard</text><rect x="50" y="115" width="390" height="145" rx="14" fill="#fff" stroke="#bac9bf" stroke-width="2"/><text x="72" y="153" font-size="27" font-weight="bold" fill="#20352f">1 · Shared source</text><text x="72" y="193" font-size="22" font-weight="normal" fill="#20352f">Same object and detail</text><text x="72" y="222" font-size="22" font-weight="normal" fill="#20352f">Same checked background</text><rect x="525" y="115" width="390" height="145" rx="14" fill="#edf3ec" stroke="#bac9bf" stroke-width="2"/><text x="547" y="153" font-size="27" font-weight="bold" fill="#20352f">2 · Real messages</text><text x="547" y="193" font-size="22" font-weight="normal" fill="#20352f">Visitor 1 describes</text><text x="547" y="222" font-size="22" font-weight="normal" fill="#20352f">Visitor 2 replies</text><rect x="1000" y="115" width="390" height="145" rx="14" fill="#fff" stroke="#bac9bf" stroke-width="2"/><text x="1022" y="153" font-size="27" font-weight="bold" fill="#20352f">3 · Clarify</text><text x="1022" y="193" font-size="22" font-weight="normal" fill="#20352f">Confirm or correct meaning</text><text x="1022" y="222" font-size="22" font-weight="normal" fill="#20352f">Keep the original words</text><path d="M444,187 L513,187" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M919,187 L988,187" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="330" font-size="28" font-weight="bold" fill="#20352f">Save the exchange here. The next stage has a separate record.</text><rect x="50" y="390" width="390" height="145" rx="14" fill="#f7eee5" stroke="#bac9bf" stroke-width="2"/><text x="72" y="428" font-size="27" font-weight="bold" fill="#20352f">4 · Image input</text><text x="72" y="468" font-size="22" font-weight="normal" fill="#20352f">Permitted source crop</text><text x="72" y="497" font-size="22" font-weight="normal" fill="#20352f">Your approved description</text><rect x="525" y="390" width="390" height="145" rx="14" fill="#f7eee5" stroke="#bac9bf" stroke-width="2"/><text x="547" y="428" font-size="27" font-weight="bold" fill="#20352f">5 · Preview the card</text><text x="547" y="468" font-size="22" font-weight="normal" fill="#20352f">AI illustration + fixed credits</text><text x="547" y="497" font-size="22" font-weight="normal" fill="#20352f">Accept, remove or plain card</text><rect x="1000" y="390" width="390" height="145" rx="14" fill="#f7eee5" stroke="#bac9bf" stroke-width="2"/><text x="1022" y="428" font-size="27" font-weight="bold" fill="#20352f">6 · Receive it</text><text x="1022" y="468" font-size="22" font-weight="normal" fill="#20352f">Download, optional email</text><text x="1022" y="497" font-size="22" font-weight="normal" fill="#20352f">Or finish without a card</text><path d="M444,462 L513,462" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M919,462 L988,462" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="610" width="1340" height="150" rx="14" fill="#fff" stroke="#bac9bf" stroke-width="2"/><text x="75" y="652" font-size="28" font-weight="bold" fill="#20352f">For email in a future study deployment</text><text x="75" y="695" font-size="25" font-weight="normal" fill="#20352f">Visitor requests delivery → private server sends the approved card → show actual status</text><text x="75" y="734" font-size="23" font-weight="normal" fill="#20352f">Addresses stay out of AI prompts and research transcripts. This design page sends no email.</text></g></svg>