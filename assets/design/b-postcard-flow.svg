<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title"><title id="title">B develops one card through draft, real reply, clarification, final card and optional receipt</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="100%" height="100%" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="50" y="60" font-size="35" font-weight="700">B · One postcard develops through a real conversation</text><rect x="50" y="110" width="390" height="145" rx="12" fill="#fff" stroke="#bbc9bf" stroke-width="2"/><text x="70" y="147" font-size="25" font-weight="700">1 · Start my card</text><text x="70" y="188" font-size="21" font-weight="400">Source S + approved crop C</text><text x="70" y="217" font-size="21" font-weight="400">My checked sentence M1</text><rect x="525" y="110" width="390" height="145" rx="12" fill="#f7eee5" stroke="#bbc9bf" stroke-width="2"/><text x="545" y="147" font-size="25" font-weight="700">2 · Share draft P1</text><text x="545" y="188" font-size="21" font-weight="400">AI preview + translation</text><text x="545" y="217" font-size="21" font-weight="400">Source and words together</text><rect x="1000" y="110" width="390" height="145" rx="12" fill="#fff" stroke="#bbc9bf" stroke-width="2"/><text x="1020" y="147" font-size="25" font-weight="700">3 · Real reply R</text><text x="1020" y="188" font-size="21" font-weight="400">Another visitor reads P1</text><text x="1020" y="217" font-size="21" font-weight="400">They explain or ask</text><path d="M445,181 L512,181" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M920,181 L987,181" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M1195 260 L1195 315 L245 315 L245 370" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="390" width="390" height="145" rx="12" fill="#fff" stroke="#bbc9bf" stroke-width="2"/><text x="70" y="427" font-size="25" font-weight="700">4 · Clarify M2</text><text x="70" y="468" font-size="21" font-weight="400">Keep, add or change meaning</text><text x="70" y="497" font-size="21" font-weight="400">Optional image revision</text><rect x="525" y="390" width="390" height="145" rx="12" fill="#f7eee5" stroke="#bbc9bf" stroke-width="2"/><text x="545" y="427" font-size="25" font-weight="700">5 · Final card P2</text><text x="545" y="468" font-size="21" font-weight="400">Same card ID and local crop</text><text x="545" y="497" font-size="21" font-weight="400">Words and image confirmed</text><rect x="1000" y="390" width="390" height="145" rx="12" fill="#fff" stroke="#bbc9bf" stroke-width="2"/><text x="1020" y="427" font-size="25" font-weight="700">6 · Keep its result</text><text x="1020" y="468" font-size="21" font-weight="400">Download or optional email</text><text x="1020" y="497" font-size="21" font-weight="400">Carry this exchange forward</text><path d="M445,461 L512,461" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M920,461 L987,461" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="610" width="1340" height="145" rx="12" fill="#edf3ec" stroke="#bbc9bf" stroke-width="2"/><text x="75" y="651" font-size="29" font-weight="700">One source · one local crop · one developing postcard</text><text x="75" y="694" font-size="25" font-weight="400">A physical action guides A. A real reply and clarification guide B.</text><text x="75" y="733" font-size="22" font-weight="400">Use the same small capture station. Keep reply status and delivery choice visible.</text></g></svg>