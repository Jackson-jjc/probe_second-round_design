<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">First-stage B: read, write, manually assemble a postcard, reply, submit and keep an own copy</title><desc id="desc">First-stage manual simulation using prepared AI examples. ERGO 117392 V1.0, 21 October 2026.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="780" fill="#faf8f1"/><g font-family="Arial, sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">B · Original words, a chosen image and replies</tspan></text><text x="45" y="101" font-size="23" font-weight="400"><tspan x="45" dy="0">Prepared AI images · manual card assembly · about three minutes</tspan></text><rect x="45" y="145" width="390" height="195" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="63" y="190" font-size="25" font-weight="650"><tspan x="63" dy="0">1  Read the source</tspan></text><text x="63" y="238" font-size="21" font-weight="400"><tspan x="63" dy="0">Look at object information</tspan><tspan x="63" dy="30">and earlier submitted cards.</tspan></text><path d="M440 240 L505 240" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="145" width="390" height="195" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="538" y="190" font-size="25" font-weight="650"><tspan x="538" dy="0">2  Add your words</tspan></text><text x="538" y="238" font-size="21" font-weight="400"><tspan x="538" dy="0">Write in any language.</tspan><tspan x="538" dy="30">Choose a prepared AI image.</tspan></text><path d="M915 240 L980 240" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="995" y="145" width="390" height="195" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="1013" y="190" font-size="25" font-weight="650"><tspan x="1013" dy="0">3  Make one postcard</tspan></text><text x="1013" y="238" font-size="21" font-weight="400"><tspan x="1013" dy="0">Researcher combines exact words,</tspan><tspan x="1013" dy="30">source and chosen image.</tspan></text><rect x="45" y="395" width="390" height="195" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="63" y="440" font-size="25" font-weight="650"><tspan x="63" dy="0">4  Reply or clarify</tspan></text><text x="63" y="488" font-size="21" font-weight="400"><tspan x="63" dy="0">Respond to an earlier card.</tspan><tspan x="63" dy="30">Keep different interpretations.</tspan></text><path d="M440 490 L505 490" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="395" width="390" height="195" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="538" y="440" font-size="25" font-weight="650"><tspan x="538" dy="0">5  Check and submit</tspan></text><text x="538" y="488" font-size="21" font-weight="400"><tspan x="538" dy="0">Check for identifying details.</tspan><tspan x="538" dy="30">Anonymous cards join the wall.</tspan></text><path d="M915 490 L980 490" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="995" y="395" width="390" height="195" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="1013" y="440" font-size="25" font-weight="650"><tspan x="1013" dy="0">6  Keep your own copy</tspan></text><text x="1013" y="488" font-size="21" font-weight="400"><tspan x="1013" dy="0">Optional paper copy of own card.</tspan><tspan x="1013" dy="30">Other people’s replies stay off it.</tspan></text><path d="M1195 345 L1195 370" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M1195 370 L240 370 L240 390" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="655" width="1340" height="88" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="67" y="692" font-size="26" font-weight="650"><tspan x="67" dy="0">Both A and B postcards share one local wall.</tspan></text><text x="67" y="726" font-size="20" font-weight="400"><tspan x="67" dy="0">Prepared starter notes are labelled. Participant words stay outside AI services.</tspan></text></g></svg>