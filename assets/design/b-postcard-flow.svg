<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title"><title id="title">Working B exchange with AI language/image assistance and conversation-linked postcard</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="780" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="45" y="58" font-size="33" font-weight="650"><tspan x="45" dy="0">B · Exchange meanings, then carry the exchange forward</tspan></text><text x="45" y="102" font-size="23" font-weight="400"><tspan x="45" dy="0">Working probe concept · conversation and related postcards remain connected</tspan></text><rect x="45" y="145" width="390" height="195" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="63" y="187" font-size="24" font-weight="650"><tspan x="63" dy="0">1  Interpret the source</tspan></text><text x="63" y="237" font-size="21" font-weight="400"><tspan x="63" dy="0">Keep the named object visible.</tspan><tspan x="63" dy="30">Express a meaning in your language.</tspan></text><path d="M440 240 L505 240" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="520" y="145" width="390" height="195" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="538" y="187" font-size="24" font-weight="650"><tspan x="538" dy="0">2  AI helps express it</tspan></text><text x="538" y="237" font-size="21" font-weight="400"><tspan x="538" dy="0">Assist language and image preview.</tspan><tspan x="538" dy="30">Keep original words identified.</tspan></text><path d="M915 240 L980 240" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="995" y="145" width="390" height="195" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="1013" y="187" font-size="24" font-weight="650"><tspan x="1013" dy="0">3  Receive a real reply</tspan></text><text x="1013" y="237" font-size="21" font-weight="400"><tspan x="1013" dy="0">Another person responds, asks</tspan><tspan x="1013" dy="30">or offers a different interpretation.</tspan></text><rect x="45" y="395" width="390" height="195" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="63" y="437" font-size="24" font-weight="650"><tspan x="63" dy="0">4  Clarify the meaning</tspan></text><text x="63" y="487" font-size="21" font-weight="400"><tspan x="63" dy="0">Keep the conversation visible.</tspan><tspan x="63" dy="30">Clarify or retain different readings.</tspan></text><path d="M440 490 L505 490" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="520" y="395" width="390" height="195" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="538" y="437" font-size="24" font-weight="650"><tspan x="538" dy="0">5  Develop the postcard</tspan></text><text x="538" y="487" font-size="21" font-weight="400"><tspan x="538" dy="0">A selected message links the card</tspan><tspan x="538" dy="30">to the exchange and source.</tspan></text><path d="M915 490 L980 490" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="995" y="395" width="390" height="195" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="1013" y="437" font-size="24" font-weight="650"><tspan x="1013" dy="0">6  Keep the outcome</tspan></text><text x="1013" y="487" font-size="21" font-weight="400"><tspan x="1013" dy="0">Retain the associated postcard.</tspan><tspan x="1013" dy="30">Develop delivery in a later study.</tspan></text><path d="M1195 345 L1195 370 L240 370 L240 390" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="655" width="1340" height="88" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="65" y="692" font-size="24" font-weight="650"><tspan x="65" dy="0">Round 1 explores this with original-language messages and prepared AI images.</tspan></text><text x="65" y="727" font-size="21" font-weight="400"><tspan x="65" dy="0">The full conversation and related cards occupy separate areas of one local whiteboard.</tspan></text></g></svg>