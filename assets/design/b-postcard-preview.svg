<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title"><title id="title">Postcard sketch with separate AI illustration, unchanged source image and approved visitor words</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58766d"/></marker><clipPath id="illustration"><rect x="95" y="178" width="760" height="415" rx="9"/></clipPath></defs><rect width="100%" height="100%" fill="#faf8f1"/><g font-family="Arial, sans-serif" fill="#20352f"><text x="65" y="65" font-size="37" font-weight="bold" fill="#20352f">B · Postcard preview</text><text x="65" y="105" font-size="22" font-weight="normal" fill="#20352f">Invented example · not a visitor result or a target-venue image</text><rect x="65" y="145" width="1270" height="635" rx="14" fill="#fffdf6" stroke="#bac9bf" stroke-width="2"/><rect x="95" y="178" width="760" height="415" rx="9" fill="#e5e9dc"/><g clip-path="url(#illustration)"><path d="M95 390 Q220 220 350 390 T610 390 T855 390 V593 H95 Z" fill="#4a7282"/><path d="M95 470 Q220 305 350 470 T610 470 T855 470 V593 H95 Z" fill="#779aa2"/><path d="M95 540 Q220 380 350 540 T610 540 T855 540 V593 H95 Z" fill="#bbc9bc"/></g><text x="117" y="218" font-size="20" font-weight="bold" fill="#20352f">AI ILLUSTRATION OF MY RESPONSE</text><rect x="900" y="178" width="400" height="240" rx="14" fill="#f2eee2" stroke="#bac9bf" stroke-width="2"/><text x="923" y="218" font-size="19" font-weight="bold" fill="#20352f">UNCHANGED SOURCE</text><rect x="925" y="245" width="100" height="105" fill="#b97355"/><rect x="1037" y="245" width="100" height="105" fill="#4a627d"/><rect x="1149" y="245" width="100" height="105" fill="#8b9d7b"/><text x="923" y="391" font-size="18" font-weight="normal" fill="#20352f">Source-thumbnail placeholder</text><text x="900" y="465" font-size="25" font-weight="bold" fill="#20352f">My approved words</text><text x="900" y="510" font-size="24" font-weight="normal" fill="#20352f">“These repeated shapes</text><text x="900" y="545" font-size="24" font-weight="normal" fill="#20352f">remind me of waves.”</text><text x="95" y="647" font-size="28" font-weight="bold" fill="#20352f">A personal response to one named object</text><text x="95" y="689" font-size="23" font-weight="normal" fill="#20352f">Artist + work title + source link + image credit</text><text x="95" y="730" font-size="23" font-weight="normal" fill="#20352f">My original words · identified translation · AI involvement</text><text x="65" y="831" font-size="23" font-weight="normal" fill="#20352f">The model makes the illustration. A fixed layout adds the source image, exact words and credit.</text><text x="65" y="870" font-size="23" font-weight="normal" fill="#20352f">Preview first. Choose a plain card, download or request optional one-off email delivery.</text></g></svg>