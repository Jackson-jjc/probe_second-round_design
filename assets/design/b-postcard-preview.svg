<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title"><title id="title">One bag-corner postcard changes after a real reply, keeping its source and local crop</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="100%" height="100%" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="50" y="60" font-size="36" font-weight="700">B · The final postcard grows from the draft</text><text x="50" y="105" font-size="22" font-weight="400">Layout sketch with invented source patterns and dialogue</text><rect x="50" y="165" width="610" height="470" rx="12" fill="#fffdf6" stroke="#bbc9bf" stroke-width="2"/><text x="72" y="203" font-size="25" font-weight="700">P1 · First draft</text><rect x="72" y="225" width="355" height="225" rx="12" fill="#e9e5d8" stroke="#bbc9bf" stroke-width="2"/><text x="86" y="250" font-size="15" font-weight="700">LOCAL BAG-CORNER PREVIEW</text><path d="M118 278 L363 278 L392 425 L92 425 Z" fill="#d7c7a6" stroke="#948264" stroke-width="3"/><path d="M155 276 Q240 202 325 276" stroke="#948264" stroke-width="8" fill="none"/><path d="M120 330 Q190 285 250 345 T370 345" stroke="#3f6c76" stroke-width="25" fill="none"/><rect x="445" y="225" width="190" height="135" rx="12" fill="#edf3ec" stroke="#bbc9bf" stroke-width="2"/><text x="459" y="252" font-size="17" font-weight="700">SOURCE</text><path d="M470 285 L610 305 M470 305 L610 325" stroke="#a4674a" stroke-width="7"/><text x="445" y="398" font-size="19" font-weight="400">Same source</text><text x="445" y="429" font-size="19" font-weight="400">Same crop C</text><text x="72" y="490" font-size="20" font-weight="700">My checked words</text><text x="72" y="527" font-size="22" font-weight="400">“This edge reminds me of a path.”</text><text x="72" y="606" font-size="17" font-weight="400">Artist + work + source credit + AI label</text><rect x="740" y="165" width="610" height="470" rx="12" fill="#fffdf6" stroke="#bbc9bf" stroke-width="2"/><text x="762" y="203" font-size="25" font-weight="700">P2 · After the reply</text><rect x="762" y="225" width="355" height="225" rx="12" fill="#e9e5d8" stroke="#bbc9bf" stroke-width="2"/><text x="776" y="250" font-size="15" font-weight="700">LOCAL BAG-CORNER PREVIEW</text><path d="M808 278 L1053 278 L1082 425 L782 425 Z" fill="#d7c7a6" stroke="#948264" stroke-width="3"/><path d="M845 276 Q930 202 1015 276" stroke="#948264" stroke-width="8" fill="none"/><path d="M820 328 Q910 300 1037 355 M820 348 Q910 320 1037 375" stroke="#3f6c76" stroke-width="9" fill="none"/><rect x="1135" y="225" width="190" height="135" rx="12" fill="#edf3ec" stroke="#bbc9bf" stroke-width="2"/><text x="1149" y="252" font-size="17" font-weight="700">SOURCE</text><path d="M1160 285 L1300 305 M1160 305 L1300 325" stroke="#a4674a" stroke-width="7"/><text x="1135" y="398" font-size="19" font-weight="400">Same source</text><text x="1135" y="429" font-size="19" font-weight="400">Same crop C</text><text x="762" y="490" font-size="20" font-weight="700">My checked words</text><text x="762" y="527" font-size="22" font-weight="400">“I mean the two lines meeting the edge,</text><text x="762" y="556" font-size="22" font-weight="400">following the edge.”</text><text x="762" y="606" font-size="17" font-weight="400">Artist + work + source credit + AI label</text><path d="M669,400 L727,400" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="685" width="1300" height="150" rx="12" fill="#edf3ec" stroke="#bbc9bf" stroke-width="2"/><text x="75" y="724" font-size="26" font-weight="700">Real recipient: “Do you mean a river, or the two lines?”</text><text x="75" y="765" font-size="24" font-weight="400">Sender clarifies. The same card’s words and optional pattern preview are updated.</text><text x="75" y="807" font-size="22" font-weight="400">Choose final P2 → download or optional email. Original words and reply stay linked.</text><text x="50" y="877" font-size="20" font-weight="400">An imagined dialogue illustrates the flow. The study will retain actual drafts, replies and revisions.</text></g></svg>