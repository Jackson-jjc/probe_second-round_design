<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">First-stage shared postcard wall with A source/effect choice and B original words, image and reply</title><desc id="desc">First-stage manual simulation using prepared AI examples. ERGO 117392 V1.0, 21 October 2026.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="820" fill="#faf8f1"/><g font-family="Arial, sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">One local postcard wall · two kinds of card</tspan></text><text x="45" y="100" font-size="22" font-weight="400"><tspan x="45" dy="0">Illustrative patterns and wording · submitted anonymous cards remain for later participants</tspan></text><rect x="45" y="140" width="630" height="500" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><rect x="735" y="140" width="650" height="500" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="70" y="185" font-size="28" font-weight="650"><tspan x="70" dy="0">A · Source + selected effect</tspan></text><text x="760" y="185" font-size="28" font-weight="650"><tspan x="760" dy="0">B · Source + original words + image</tspan></text><rect x="70" y="220" width="165" height="160" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M89 270 l70 15 M89 294 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="189" cy="284" r="13" fill="#537d78"/><text x="82" y="413" font-size="20" font-weight="400"><tspan x="82" dy="0">Source detail</tspan></text><rect x="275" y="220" width="370" height="220" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M370 265 l140 -12 12 105 -140 12 Z" fill="#e8dfcd" stroke="#978668" stroke-width="3"/><path d="M390 295 l70 15 M390 319 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="490" cy="309" r="13" fill="#537d78"/><text x="297" y="481" font-size="21" font-weight="400"><tspan x="297" dy="0">Selected prepared cuff/bag effect</tspan></text><text x="70" y="560" font-size="22" font-weight="400"><tspan x="70" dy="0">Choice of source detail and example</tspan><tspan x="70" dy="31">is retained with questionnaire feedback.</tspan></text><rect x="760" y="220" width="140" height="130" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M774 262 l70 15 M774 286 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="874" cy="276" r="13" fill="#537d78"/><rect x="935" y="220" width="420" height="130" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="953" y="261" font-size="23" font-weight="650"><tspan x="953" dy="0">Prepared AI image</tspan></text><path d="M1070 290 l70 15 M1070 314 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="1170" cy="304" r="13" fill="#537d78"/><text x="760" y="395" font-size="20" font-weight="650"><tspan x="760" dy="0">Original words · invented example</tspan></text><text x="760" y="433" font-size="24" font-weight="400"><tspan x="760" dy="0">“This edge reminds me of a path.”</tspan></text><rect x="760" y="475" width="595" height="125" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="780" y="510" font-size="19" font-weight="650"><tspan x="780" dy="0">Linked reply · invented example</tspan></text><text x="780" y="551" font-size="22" font-weight="400"><tspan x="780" dy="0">“Which part looks like a path to you?”</tspan></text><rect x="45" y="675" width="1340" height="105" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="67" y="713" font-size="27" font-weight="650"><tspan x="67" dy="0">Optional printed copies of your own A and B cards</tspan></text><text x="67" y="751" font-size="22" font-weight="400"><tspan x="67" dy="0">Exclude other people’s replies. Questionnaire answers stay private.</tspan></text></g></svg>