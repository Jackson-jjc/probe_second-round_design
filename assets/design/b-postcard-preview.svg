<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title"><title id="title">Conversation history next to an Image/Text postcard linked to a selected message</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="820" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">A full conversation and its related postcard</tspan></text><text x="45" y="101" font-size="22" font-weight="400"><tspan x="45" dy="0">Illustrative layout and invented wording · one message links the two views</tspan></text><rect x="45" y="145" width="510" height="530" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="67" y="190" font-size="29" font-weight="650"><tspan x="67" dy="0">Conversation</tspan></text><rect x="67" y="225" width="465" height="95" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="83" y="254" font-size="19" font-weight="650"><tspan x="83" dy="0">Original message</tspan></text><text x="83" y="291" font-size="21" font-weight="400"><tspan x="83" dy="0">“This edge reminds me of a path.”</tspan></text><rect x="67" y="340" width="465" height="95" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="83" y="369" font-size="19" font-weight="650"><tspan x="83" dy="0">Reply</tspan></text><text x="83" y="406" font-size="21" font-weight="400"><tspan x="83" dy="0">“Which part looks like a path?”</tspan></text><rect x="67" y="455" width="465" height="95" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="83" y="484" font-size="19" font-weight="650"><tspan x="83" dy="0">Clarification</tspan></text><text x="83" y="521" font-size="21" font-weight="400"><tspan x="83" dy="0">“The two lines following its edge.”</tspan></text><text x="67" y="620" font-size="21" font-weight="400"><tspan x="67" dy="0">Original words and full reply history</tspan><tspan x="67" dy="30">remain visible in their own area.</tspan></text><path d="M565 400 L650 400" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="665" y="145" width="720" height="530" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="687" y="190" font-size="29" font-weight="650"><tspan x="687" dy="0">Related postcard</tspan></text><rect x="687" y="225" width="325" height="335" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><rect x="1030" y="225" width="333" height="335" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="709" y="266" font-size="27" font-weight="650"><tspan x="709" dy="0">Image</tspan></text><text x="1052" y="266" font-size="27" font-weight="650"><tspan x="1052" dy="0">Text</tspan></text><path d="M760 345 l140 -12 12 105 -140 12 Z" fill="#e8dfcd" stroke="#978668" stroke-width="3"/><path d="M780 375 l70 15 M780 399 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="880" cy="389" r="13" fill="#537d78"/><text x="1052" y="330" font-size="21" font-weight="650"><tspan x="1052" dy="0">Selected message</tspan></text><text x="1052" y="377" font-size="23" font-weight="400"><tspan x="1052" dy="0">“The two lines</tspan><tspan x="1052" dy="33">following its edge.”</tspan></text><text x="687" y="615" font-size="20" font-weight="400"><tspan x="687" dy="0">Source credit and the link to the selected message stay with the card.</tspan></text><rect x="45" y="705" width="1340" height="75" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="65" y="751" font-size="23" font-weight="400"><tspan x="65" dy="0">Round 1: same local whiteboard, with a conversation area and a separate postcard area.</tspan></text></g></svg>