<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title"><title id="title">Working A concept with plain step names and no hand illustration</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="760" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">A · The intended material-and-AI interaction</tspan></text><text x="45" y="102" font-size="22" font-weight="400"><tspan x="45" dy="0">Working probe concept · the first prototype round explores it with simpler prepared examples</tspan></text><rect x="45" y="145" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="61" y="188" font-size="23" font-weight="650"><tspan x="61" dy="0">1  Approve a photo</tspan></text><rect x="80" y="230" width="230" height="200" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M123 270 l130 -8 8 105 -130 8 Z" fill="#e8dfcd" stroke="#978668" stroke-width="3"/><text x="61" y="493" font-size="21" font-weight="400"><tspan x="61" dy="0">Use one cuff or bag area.</tspan><tspan x="61" dy="30">Keep the source visible.</tspan><tspan x="61" dy="30">Approve the local input.</tspan></text><path d="M350 340 L385 340" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="395" y="145" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="411" y="188" font-size="23" font-weight="650"><tspan x="411" dy="0">2  See AI’s preview</tspan></text><rect x="430" y="230" width="230" height="200" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M470 270 l140 -12 12 105 -140 12 Z" fill="#e8dfcd" stroke="#978668" stroke-width="3"/><path d="M490 300 l70 15 M490 324 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="590" cy="314" r="13" fill="#537d78"/><text x="411" y="493" font-size="21" font-weight="400"><tspan x="411" dy="0">AI adapts a source pattern</tspan><tspan x="411" dy="30">to that local photograph.</tspan><tspan x="411" dy="30">Check its response.</tspan></text><path d="M700 340 L735 340" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="745" y="145" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="761" y="188" font-size="23" font-weight="650"><tspan x="761" dy="0">3  Make an adjustment</tspan></text><rect x="780" y="230" width="230" height="200" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M818 270 l125 -10 10 100 -125 10 Z" fill="#e8dfcd" stroke="#978668" stroke-width="3"/><path d="M817 300 l125 -10" stroke="#978668" stroke-width="6"/><text x="804" y="405" font-size="20" font-weight="400"><tspan x="804" dy="0">Physical change</tspan></text><text x="761" y="493" font-size="21" font-weight="400"><tspan x="761" dy="0">Fold, flatten or reposition.</tspan><tspan x="761" dy="30">Approve the next photo</tspan><tspan x="761" dy="30">to guide the next response.</tspan></text><path d="M1050 340 L1085 340" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1095" y="145" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="1111" y="188" font-size="23" font-weight="650"><tspan x="1111" dy="0">4  Compare and explain</tspan></text><rect x="1130" y="230" width="230" height="200" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M1153 280 l70 15 M1153 304 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="1253" cy="294" r="13" fill="#537d78"/><path d="M1202 355 l70 15 M1202 379 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="1302" cy="369" r="13" fill="#537d78"/><text x="1111" y="493" font-size="21" font-weight="400"><tspan x="1111" dy="0">Compare the AI previews.</tspan><tspan x="1111" dy="30">Explain what still connects</tspan><tspan x="1111" dy="30">to the source, and why.</tspan></text><text x="45" y="729" font-size="21" font-weight="400"><tspan x="45" dy="0">The cuff or bag is a presentation form. The research question concerns understandings of authenticity.</tspan></text></g></svg>