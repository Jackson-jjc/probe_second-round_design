<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title"><title id="title">Round 1 only: low-fidelity A and B, full conversation, related postcards and anonymous feedback</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="820" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">Round 1 · Two low-fidelity versions of A and B</tspan></text><text x="45" y="101" font-size="22" font-weight="400"><tspan x="45" dy="0">ERGO 117392 · V1.0 · 22 October 2026 · 10–15 ECS adults · 10–15 minutes total</tspan></text><rect x="45" y="145" width="640" height="420" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><rect x="735" y="145" width="650" height="420" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="67" y="190" font-size="28" font-weight="650"><tspan x="67" dy="0">A · Authenticity</tspan></text><text x="757" y="190" font-size="28" font-weight="650"><tspan x="757" dy="0">B · Cross-cultural exchange</tspan></text><text x="67" y="241" font-size="22" font-weight="400"><tspan x="67" dy="0">Provided textile image and information</tspan><tspan x="67" dy="31">↓</tspan><tspan x="67" dy="31">Arrange simple materials</tspan><tspan x="67" dy="31">↓</tspan><tspan x="67" dy="31">Compare prepared AI cuff/bag effects</tspan><tspan x="67" dy="31">↓</tspan><tspan x="67" dy="31">Choose a postcard and optional caption</tspan></text><text x="757" y="241" font-size="22" font-weight="400"><tspan x="757" dy="0">Read all earlier messages and replies</tspan><tspan x="757" dy="31">↓</tspan><tspan x="757" dy="31">Add a comment or reply in any language</tspan><tspan x="757" dy="31">↓</tspan><tspan x="757" dy="31">Select a message and prepared AI image</tspan><tspan x="757" dy="31">↓</tspan><tspan x="757" dy="31">Researcher makes a related postcard</tspan></text><rect x="45" y="605" width="1340" height="155" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="67" y="647" font-size="26" font-weight="650"><tspan x="67" dy="0">One local whiteboard · full conversation area + related A/B postcard area</tspan></text><text x="67" y="695" font-size="22" font-weight="400"><tspan x="67" dy="0">Four optional questionnaire questions guide refinement and further prototype rounds.</tspan></text><text x="67" y="731" font-size="22" font-weight="400"><tspan x="67" dy="0">Optional printed copies of own cards exclude other people’s replies.</tspan></text></g></svg>