<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title"><title id="title">A links one source with approved cuff or bag crops, physical action, AI previews and a visitor reason</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="100%" height="100%" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="50" y="60" font-size="36" font-weight="700">A · My cuff or bag, two physical turns</text><rect x="50" y="95" width="1340" height="115" rx="12" fill="#edf3ec" stroke="#bbc9bf" stroke-width="2"/><text x="70" y="132" font-size="25" font-weight="700">S · Fixed heritage source</text><text x="70" y="173" font-size="21" font-weight="400">Named work + selected detail + checked background</text><rect x="50" y="270" width="390" height="145" rx="12" fill="#fff" stroke="#bbc9bf" stroke-width="2"/><text x="70" y="307" font-size="25" font-weight="700">C1 · Local crop</text><text x="70" y="348" font-size="21" font-weight="400">Cuff or bag in one window</text><text x="70" y="377" font-size="21" font-weight="400">Visitor approves the crop</text><rect x="525" y="270" width="390" height="145" rx="12" fill="#edf3ec" stroke="#bbc9bf" stroke-width="2"/><text x="545" y="307" font-size="25" font-weight="700">G1 · AI preview</text><text x="545" y="348" font-size="21" font-weight="400">Pattern adapted to C1</text><text x="545" y="377" font-size="21" font-weight="400">Source and crop stay visible</text><rect x="1000" y="270" width="390" height="145" rx="12" fill="#fff" stroke="#bbc9bf" stroke-width="2"/><text x="1020" y="307" font-size="25" font-weight="700">C2 · Physical response</text><text x="1020" y="348" font-size="21" font-weight="400">Fold, flatten or reposition</text><text x="1020" y="377" font-size="21" font-weight="400">Capture the same local area</text><path d="M445,340 L512,340" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M920,340 L987,340" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M1195 420 L1195 475 L720 475 L720 520" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="525" y="535" width="390" height="145" rx="12" fill="#edf3ec" stroke="#bbc9bf" stroke-width="2"/><text x="545" y="572" font-size="25" font-weight="700">G2 · Next AI preview</text><text x="545" y="613" font-size="21" font-weight="400">Same source and settings</text><text x="545" y="642" font-size="21" font-weight="400">Compare both responses</text><rect x="1000" y="535" width="390" height="145" rx="12" fill="#fff" stroke="#bbc9bf" stroke-width="2"/><text x="1020" y="572" font-size="25" font-weight="700">R · My reason</text><text x="1020" y="613" font-size="21" font-weight="400">Point to a meaningful change</text><text x="1020" y="642" font-size="21" font-weight="400">Explain its source connection</text><path d="M920,606 L987,606" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="560" font-size="24" font-weight="700">One small capture area.</text><text x="50" y="600" font-size="24" font-weight="700">A physical action guides AI.</text><text x="50" y="645" font-size="20" font-weight="400">Keep actual crops, outputs and reasons.</text></g></svg>