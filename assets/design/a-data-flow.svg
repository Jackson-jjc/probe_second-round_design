<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title"><title id="title">Working A concept: source, first photo, first AI preview, adjustment, second photo and next preview</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="780" fill="#faf8f1"/><g font-family="Arial,sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">A · One source, a material action and AI responses</tspan></text><text x="45" y="102" font-size="22" font-weight="400"><tspan x="45" dy="0">Intended working interaction · data collection would be specified for a later study</tspan></text><rect x="45" y="140" width="1340" height="105" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="65" y="182" font-size="27" font-weight="650"><tspan x="65" dy="0">Named textile source</tspan></text><text x="65" y="222" font-size="23" font-weight="400"><tspan x="65" dy="0">Source image, selected detail and checked information stay visible.</tspan></text><rect x="45" y="290" width="390" height="165" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="65" y="330" font-size="25" font-weight="650"><tspan x="65" dy="0">First approved photo</tspan></text><text x="65" y="375" font-size="21" font-weight="400"><tspan x="65" dy="0">One local cuff or bag area.</tspan><tspan x="65" dy="30">The person approves the input.</tspan></text><rect x="525" y="290" width="390" height="165" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="545" y="330" font-size="25" font-weight="650"><tspan x="545" dy="0">First AI preview</tspan></text><text x="545" y="375" font-size="21" font-weight="400"><tspan x="545" dy="0">AI adapts the source detail</tspan><tspan x="545" dy="30">to the approved local photo.</tspan></text><rect x="1005" y="290" width="390" height="165" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="1025" y="330" font-size="25" font-weight="650"><tspan x="1025" dy="0">Material response</tspan></text><text x="1025" y="375" font-size="21" font-weight="400"><tspan x="1025" dy="0">Fold, flatten or reposition.</tspan><tspan x="1025" dy="30">Approve a second photo.</tspan></text><rect x="525" y="540" width="390" height="165" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="545" y="580" font-size="25" font-weight="650"><tspan x="545" dy="0">Next AI preview</tspan></text><text x="545" y="625" font-size="21" font-weight="400"><tspan x="545" dy="0">AI responds to the adjustment.</tspan><tspan x="545" dy="30">Compare the two actual results.</tspan></text><rect x="1005" y="540" width="390" height="165" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="1025" y="580" font-size="25" font-weight="650"><tspan x="1025" dy="0">Participant explanation</tspan></text><text x="1025" y="625" font-size="21" font-weight="400"><tspan x="1025" dy="0">What changed for you?</tspan><tspan x="1025" dy="30">What still connects to the source?</tspan></text><path d="M440 370 L511 370" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M920 370 L991 370" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1195 460 L1195 495 L720 495 L720 535" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M920 620 L991 620" stroke="#58766d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="45" y="585" font-size="22" font-weight="650"><tspan x="45" dy="0">Round 1 uses prepared</tspan></text><text x="45" y="620" font-size="22" font-weight="400"><tspan x="45" dy="0">examples and a separate</tspan></text><text x="45" y="655" font-size="22" font-weight="400"><tspan x="45" dy="0">anonymous feedback plan.</tspan></text><text x="45" y="750" font-size="21" font-weight="400"><tspan x="45" dy="0">Plain names describe the sequence. Each box represents an image, an action or an explanation.</tspan></text></g></svg>