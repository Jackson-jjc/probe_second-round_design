<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc"><title id="title">First-stage A with plain labels: preparation, manual simulation and retained data</title><desc id="desc">First-stage manual simulation using prepared AI examples. ERGO 117392 V1.0, 21 October 2026.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="780" fill="#faf8f1"/><g font-family="Arial, sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">A · Who does what, and what we keep</tspan></text><text x="45" y="101" font-size="23" font-weight="400"><tspan x="45" dy="0">The researcher explains the manual simulation before the activity.</tspan></text><rect x="45" y="145" width="390" height="550" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="67" y="190" font-size="28" font-weight="650"><tspan x="67" dy="0">Before the session</tspan></text><rect x="525" y="145" width="390" height="550" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="547" y="190" font-size="28" font-weight="650"><tspan x="547" dy="0">During the session</tspan></text><rect x="1005" y="145" width="390" height="550" rx="12" fill="#f7eee5" stroke="#b6c8bb" stroke-width="2"/><text x="1027" y="190" font-size="28" font-weight="650"><tspan x="1027" dy="0">Research record</tspan></text><text x="67" y="245" font-size="24" font-weight="650"><tspan x="67" dy="0">Researcher + AI</tspan></text><text x="67" y="290" font-size="21" font-weight="400"><tspan x="67" dy="0">Prepare source-linked examples:</tspan><tspan x="67" dy="30">• source detail</tspan><tspan x="67" dy="30">• sample material layout</tspan><tspan x="67" dy="30">• effect on a cuff/bag picture</tspan></text><text x="67" y="470" font-size="22" font-weight="400"><tspan x="67" dy="0">Check the examples and context.</tspan><tspan x="67" dy="31">Keep the source visible.</tspan></text><text x="547" y="245" font-size="24" font-weight="650"><tspan x="547" dy="0">Participant</tspan></text><text x="547" y="290" font-size="22" font-weight="400"><tspan x="547" dy="0">Choose a source detail.</tspan><tspan x="547" dy="31">Arrange simple materials.</tspan><tspan x="547" dy="31">Adjust and compare examples.</tspan><tspan x="547" dy="31">Select a postcard.</tspan></text><text x="547" y="465" font-size="24" font-weight="650"><tspan x="547" dy="0">Researcher</tspan></text><text x="547" y="510" font-size="22" font-weight="400"><tspan x="547" dy="0">Manually switch prepared</tspan><tspan x="547" dy="31">examples and place the chosen</tspan><tspan x="547" dy="31">card on the local study wall.</tspan></text><text x="1027" y="245" font-size="24" font-weight="650"><tspan x="1027" dy="0">Retained</tspan></text><text x="1027" y="290" font-size="21" font-weight="400"><tspan x="1027" dy="0">Selected source-detail reference.</tspan><tspan x="1027" dy="30">Selected prepared-image reference.</tspan><tspan x="1027" dy="30">Consent and questionnaire.</tspan></text><text x="1027" y="465" font-size="24" font-weight="650"><tspan x="1027" dy="0">Question 2</tspan></text><text x="1027" y="510" font-size="24" font-weight="400"><tspan x="1027" dy="0">What kept or changed</tspan><tspan x="1027" dy="34">what felt authentic?</tspan><tspan x="1027" dy="34">Why?</tspan></text><path d="M440 380 L511 380" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M920 380 L991 380" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="746" font-size="22" font-weight="400"><tspan x="45" dy="0">A’s physical arrangements are not retained. No photographs or interaction logs.</tspan></text></g></svg>