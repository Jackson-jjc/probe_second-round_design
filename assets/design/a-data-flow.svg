<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title"><title id="title">A data sequence from source and layouts through two actual AI responses to a visitor reason</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58766d"/></marker></defs><rect width="100%" height="100%" fill="#faf8f1"/><g font-family="Arial, sans-serif" fill="#20352f"><text x="50" y="60" font-size="36" font-weight="bold" fill="#20352f">A · Follow actions, responses and reasons</text><rect x="50" y="100" width="1340" height="125" rx="14" fill="#edf3ec" stroke="#bac9bf" stroke-width="2"/><text x="72" y="138" font-size="27" font-weight="bold" fill="#20352f">S · One fixed source</text><text x="72" y="178" font-size="22" font-weight="normal" fill="#20352f">Named object + selected detail</text><text x="72" y="207" font-size="22" font-weight="normal" fill="#20352f">Same image in both rounds</text><rect x="50" y="285" width="390" height="145" rx="14" fill="#fff" stroke="#bac9bf" stroke-width="2"/><text x="72" y="323" font-size="27" font-weight="bold" fill="#20352f">L1 · First layout</text><text x="72" y="363" font-size="22" font-weight="normal" fill="#20352f">Visitor arranges fabric</text><text x="72" y="392" font-size="22" font-weight="normal" fill="#20352f">Save the tabletop image</text><rect x="525" y="285" width="390" height="145" rx="14" fill="#edf3ec" stroke="#bac9bf" stroke-width="2"/><text x="547" y="323" font-size="27" font-weight="bold" fill="#20352f">G1 · AI response</text><text x="547" y="363" font-size="22" font-weight="normal" fill="#20352f">Save the actual output</text><text x="547" y="392" font-size="22" font-weight="normal" fill="#20352f">Visitor sees what changed</text><rect x="1000" y="285" width="390" height="145" rx="14" fill="#fff" stroke="#bac9bf" stroke-width="2"/><text x="1022" y="323" font-size="27" font-weight="bold" fill="#20352f">L2 · Next layout</text><text x="1022" y="363" font-size="22" font-weight="normal" fill="#20352f">Visitor moves one piece</text><text x="1022" y="392" font-size="22" font-weight="normal" fill="#20352f">Or keeps G1 / stops</text><path d="M444,357 L513,357" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M919,357 L988,357" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><path d="M1195,435 L1195,480 L720,480 L720,520" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="525" y="535" width="390" height="145" rx="14" fill="#edf3ec" stroke="#bac9bf" stroke-width="2"/><text x="547" y="573" font-size="27" font-weight="bold" fill="#20352f">G2 · Next AI response</text><text x="547" y="613" font-size="22" font-weight="normal" fill="#20352f">Same source and settings</text><text x="547" y="642" font-size="22" font-weight="normal" fill="#20352f">Compare G1, G2 and layouts</text><rect x="1000" y="535" width="390" height="145" rx="14" fill="#fff" stroke="#bac9bf" stroke-width="2"/><text x="1022" y="573" font-size="27" font-weight="bold" fill="#20352f">R · Brief reason</text><text x="1022" y="613" font-size="22" font-weight="normal" fill="#20352f">Point to a meaningful change</text><text x="1022" y="642" font-size="22" font-weight="normal" fill="#20352f">Explain its link to the source</text><path d="M919,607 L988,607" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="575" font-size="25" font-weight="bold" fill="#20352f">The movement is input.</text><text x="50" y="615" font-size="25" font-weight="bold" fill="#20352f">The reason gives it meaning.</text><text x="50" y="655" font-size="21" font-weight="normal" fill="#20352f">Keep failures and no-change cases too.</text></g></svg>