<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">First-stage A: source detail, material arrangement, prepared AI example and postcard</title><desc id="desc">First-stage manual simulation using prepared AI examples. ERGO 117392 V1.0, 21 October 2026.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#58766d"/></marker></defs><rect width="1440" height="760" fill="#faf8f1"/><g font-family="Arial, sans-serif" fill="#20352f"><text x="45" y="58" font-size="34" font-weight="650"><tspan x="45" dy="0">A · Choose, arrange, compare and keep</tspan></text><text x="45" y="101" font-size="23" font-weight="400"><tspan x="45" dy="0">Current first-stage test · prepared AI examples · about three minutes</tspan></text><rect x="45" y="140" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="63" y="182" font-size="24" font-weight="650"><tspan x="63" dy="0">1  Choose a detail</tspan></text><rect x="103" y="230" width="185" height="180" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M135 295 l70 15 M135 319 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="235" cy="309" r="13" fill="#537d78"/><text x="63" y="512" font-size="21" font-weight="400"><tspan x="63" dy="0">Look at the source image</tspan><tspan x="63" dy="30">and its checked context.</tspan><tspan x="63" dy="30">Select a line or shape.</tspan></text><path d="M350 350 L385 350" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="140" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="413" y="182" font-size="24" font-weight="650"><tspan x="413" dy="0">2  Arrange materials</tspan></text><rect x="425" y="228" width="240" height="180" rx="12" fill="#eee8d8" stroke="#b6c8bb" stroke-width="2"/><path d="M455 270 l80 -10 5 50 -80 10 Z" fill="#a8664c"/><path d="M555 310 l80 5 -3 50 -80 -5 Z" fill="#537d78"/><text x="440" y="445" font-size="19" font-weight="400"><tspan x="440" dy="0">Physical exploration</tspan></text><text x="413" y="512" font-size="21" font-weight="400"><tspan x="413" dy="0">Use paper, fabric, shapes</tspan><tspan x="413" dy="30">or simple objects.</tspan><tspan x="413" dy="30">Try a different layout.</tspan></text><path d="M700 350 L735 350" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="745" y="140" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="763" y="182" font-size="24" font-weight="650"><tspan x="763" dy="0">3  Compare examples</tspan></text><rect x="773" y="230" width="245" height="185" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><path d="M815 260 l140 -12 12 105 -140 12 Z" fill="#e8dfcd" stroke="#978668" stroke-width="3"/><path d="M835 290 l70 15 M835 314 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="935" cy="304" r="13" fill="#537d78"/><text x="786" y="445" font-size="18" font-weight="400"><tspan x="786" dy="0">Prepared before session</tspan></text><text x="763" y="512" font-size="21" font-weight="400"><tspan x="763" dy="0">The researcher switches</tspan><tspan x="763" dy="30">prepared cuff/bag effects.</tspan><tspan x="763" dy="30">Adjust and compare.</tspan></text><path d="M1050 350 L1085 350" fill="none" stroke="#58766d" stroke-width="3" marker-end="url(#arrow)"/><rect x="1095" y="140" width="300" height="535" rx="12" fill="#fff" stroke="#b6c8bb" stroke-width="2"/><text x="1113" y="182" font-size="24" font-weight="650"><tspan x="1113" dy="0">4  Choose a postcard</tspan></text><rect x="1127" y="225" width="235" height="220" rx="12" fill="#edf3ec" stroke="#b6c8bb" stroke-width="2"/><text x="1142" y="256" font-size="17" font-weight="400"><tspan x="1142" dy="0">Source + chosen effect</tspan></text><path d="M1164 287 l140 -12 12 105 -140 12 Z" fill="#e8dfcd" stroke="#978668" stroke-width="3"/><path d="M1184 317 l70 15 M1184 341 l70 15" stroke="#a8664c" stroke-width="9" fill="none"/><circle cx="1284" cy="331" r="13" fill="#537d78"/><text x="1113" y="512" font-size="21" font-weight="400"><tspan x="1113" dy="0">Select a source-labelled</tspan><tspan x="1113" dy="30">effect for the local wall.</tspan><tspan x="1113" dy="30">Keep an optional own copy.</tspan></text><text x="45" y="725" font-size="22" font-weight="400"><tspan x="45" dy="0">Material layouts are explored in person. The study keeps choices and questionnaire answers.</tspan></text></g></svg>